              - listitem [ref=f2e63]: Served as the sole frontend engineer on an end-to-end migration from Vue.js to React and TanStack Start, rebuilding 5 revenue critical customer journeys without interrupting live ticket sales.
            - list [ref=f2e64]:
              - listitem [ref=f2e65]: Integrated Store APIs powering ticket availability, reservations, bookings, and payment, replacing legacy Vue data flows with typed React and TanStack Start patterns.
            - list [ref=f2e66]:
              - listitem [ref=f2e67]: Fixed reliability issues across 6 production critical areas including session expiration, real-time inventory caching, booking re-entry, payment recovery, API contract mismatches, and React rendering performance.
            - list [ref=f2e68]:
              - listitem [ref=f2e69]: Rebuilt checkout and booking flows to handle high concurrency ticket releases, reducing stale inventory states during peak traffic windows.
            - list [ref=f2e70]:
